<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - App Sekolah Menabung</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-piggy-bank"></i> Sekolah Menabung</div>
    <nav class="nav flex-column py-2">
      <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <div class="nav-section-title">Data Master</div>
      <a class="nav-link" href="siswa.html" data-role="admin"><i class="fa-solid fa-user-graduate"></i> Data Siswa</a>
      <a class="nav-link" href="kelas.html" data-role="admin"><i class="fa-solid fa-chalkboard"></i> Data Kelas</a>
      <a class="nav-link" href="pengguna.html" data-role="admin"><i class="fa-solid fa-users-gear"></i> Data Pengguna</a>
      <div class="nav-section-title">Tabungan</div>
      <a class="nav-link" href="transaksi.html" data-role="admin,petugas"><i class="fa-solid fa-money-bill-transfer"></i> Transaksi</a>
      <a class="nav-link" href="tabungan.html"><i class="fa-solid fa-book"></i> Buku Tabungan</a>
      <a class="nav-link" href="laporan.html" data-role="admin,petugas,walikelas"><i class="fa-solid fa-chart-line"></i> Laporan</a>
      <div class="nav-section-title">Akun</div>
      <a class="nav-link active" href="profil.html"><i class="fa-solid fa-id-card"></i> Profil</a>
      <a class="nav-link" href="pengaturan.html" data-role="admin"><i class="fa-solid fa-gear"></i> Pengaturan</a>
      <a class="nav-link" href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
        <h5 class="mb-0 fw-bold">Profil Saya</h5>
      </div>
    </div>

    <div class="page-body">
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card text-center p-4">
            <i class="fa-solid fa-circle-user fa-5x text-primary mb-3"></i>
            <h5 class="mb-0" id="profilNama">-</h5>
            <div class="text-muted mb-2" id="profilRole">-</div>
            <span class="badge bg-success" id="profilStatus">Aktif</span>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">Informasi Akun</div>
            <div class="card-body">
              <table class="table table-borderless mb-0">
                <tr><td class="text-muted" style="width:200px">Username</td><td id="infoUsername">-</td></tr>
                <tr><td class="text-muted">Nama Lengkap</td><td id="infoNama">-</td></tr>
                <tr><td class="text-muted">Role</td><td id="infoRole">-</td></tr>
                <tr id="rowNis" style="display:none"><td class="text-muted">NIS</td><td id="infoNis">-</td></tr>
                <tr id="rowKelas" style="display:none"><td class="text-muted">Kelas</td><td id="infoKelas">-</td></tr>
                <tr id="rowSaldo" style="display:none"><td class="text-muted">Saldo Tabungan</td><td class="fw-bold text-primary" id="infoSaldo">-</td></tr>
                <tr><td class="text-muted">Waktu Login</td><td id="infoLoginAt">-</td></tr>
              </table>
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-header">Ubah Password</div>
            <div class="card-body">
              <form id="formUbahPassword" class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Password Baru</label>
                  <input type="password" class="form-control" id="passwordBaru" required minlength="6">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Konfirmasi Password Baru</label>
                  <input type="password" class="form-control" id="passwordKonfirmasi" required minlength="6">
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key me-1"></i>Perbarui Password</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
  APP.initPage();
  document.getElementById("btnToggleSidebar")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("show");
  });

  const session = AUTH.getSession();
  const roleLabel = { admin: "Administrator", petugas: "Petugas Tabungan", walikelas: "Wali Kelas", siswa: "Siswa" };

  document.getElementById("profilNama").textContent = session.nama;
  document.getElementById("profilRole").textContent = roleLabel[session.role] || session.role;
  document.getElementById("infoUsername").textContent = session.username;
  document.getElementById("infoNama").textContent = session.nama;
  document.getElementById("infoRole").textContent = roleLabel[session.role] || session.role;
  document.getElementById("infoLoginAt").textContent = APP.formatTanggalJam(session.loginAt);

  async function loadDataTambahan() {
    if (session.role === "siswa" && session.nis) {
      const res = await API.getSiswa({ nis: session.nis });
      const s = res.data[0] || res.data;
      document.getElementById("rowNis").style.display = "table-row";
      document.getElementById("rowKelas").style.display = "table-row";
      document.getElementById("rowSaldo").style.display = "table-row";
      document.getElementById("infoNis").textContent = s.nis;
      document.getElementById("infoKelas").textContent = s.namaKelas || "-";
      document.getElementById("infoSaldo").textContent = APP.formatRupiah(s.saldo);
    }
  }
  loadDataTambahan();

  document.getElementById("formUbahPassword").addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("passwordBaru").value;
    const p2 = document.getElementById("passwordKonfirmasi").value;
    if (p1 !== p2) return Swal.fire({ icon: "warning", title: "Password Tidak Cocok", text: "Konfirmasi password harus sama." });

    APP.loading("Memperbarui password...");
    try {
      const hash = await sha256(p1);
      await API.updateUser({ id: session.id, password: hash });
      APP.closeLoading();
      Swal.fire({ icon: "success", title: "Password Berhasil Diperbarui" });
      document.getElementById("formUbahPassword").reset();
    } catch (err) { APP.closeLoading(); }
  });
</script>
</body>
</html>
