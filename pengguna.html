<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Pengguna - App Sekolah Menabung</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-piggy-bank"></i> Sekolah Menabung</div>
    <nav class="nav flex-column py-2">
      <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <div class="nav-section-title">Data Master</div>
      <a class="nav-link" href="siswa.html" data-role="admin"><i class="fa-solid fa-user-graduate"></i> Data Siswa</a>
      <a class="nav-link" href="kelas.html" data-role="admin"><i class="fa-solid fa-chalkboard"></i> Data Kelas</a>
      <a class="nav-link" href="pengguna.html" data-role="admin"><i class="fa-solid fa-users-gear"></i> Data Pengguna</a>
      <div class="nav-section-title">Tabungan</div>
      <a class="nav-link" href="transaksi.html" data-role="admin,petugas"><i class="fa-solid fa-money-bill-transfer"></i> Transaksi</a>
      <a class="nav-link" href="tabungan.html"><i class="fa-solid fa-book"></i> Buku Tabungan</a>
      <a class="nav-link" href="laporan.html" data-role="admin,petugas,walikelas"><i class="fa-solid fa-chart-line"></i> Laporan</a>
      <div class="nav-section-title">Akun</div>
      <a class="nav-link" href="profil.html"><i class="fa-solid fa-id-card"></i> Profil</a>
      <a class="nav-link" href="pengaturan.html" data-role="admin"><i class="fa-solid fa-gear"></i> Pengaturan</a>
      <a class="nav-link" href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
        <h5 class="mb-0 fw-bold">Data Pengguna</h5>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="text-end d-none d-sm-block">
          <div class="fw-semibold user-display-name">-</div>
          <div class="small text-muted user-display-role">-</div>
        </div>
        <i class="fa-solid fa-circle-user fa-2x text-secondary"></i>
      </div>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Daftar Pengguna Sistem</span>
          <button class="btn btn-primary btn-sm" id="btnTambahUser"><i class="fa-solid fa-plus me-1"></i>Tambah Pengguna</button>
        </div>
        <div class="table-responsive">
          <table class="table mb-0">
            <thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="tblUser"><tr><td colspan="5" class="text-center text-muted py-4">Memuat data...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalUser" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formUser">
        <div class="modal-header">
          <h5 class="modal-title" id="modalUserTitle">Tambah Pengguna</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="userId">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="userUsername" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password <span class="small text-muted">(kosongkan jika tidak diubah)</span></label>
            <input type="password" class="form-control" id="userPassword">
          </div>
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="userNama" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" id="userRole" required>
              <option value="admin">Admin</option>
              <option value="petugas">Petugas Tabungan</option>
              <option value="walikelas">Wali Kelas</option>
              <option value="siswa">Siswa</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="userStatus">
              <option value="aktif">Aktif</option>
              <option value="nonaktif">Nonaktif</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
  APP.initPage(["admin"]);
  document.getElementById("btnToggleSidebar")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("show");
  });

  let daftarUser = [];
  const modalUser = new bootstrap.Modal(document.getElementById("modalUser"));
  const roleBadge = { admin: "badge-role-admin", petugas: "badge-role-petugas", walikelas: "badge-role-walikelas", siswa: "badge-role-siswa" };
  const roleLabel = { admin: "Administrator", petugas: "Petugas Tabungan", walikelas: "Wali Kelas", siswa: "Siswa" };

  function renderUser(data) {
    const tbody = document.getElementById("tblUser");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Belum ada pengguna</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(u => `
      <tr>
        <td>${u.username}</td>
        <td>${u.nama}</td>
        <td><span class="badge ${roleBadge[u.role] || "bg-secondary"}">${roleLabel[u.role] || u.role}</span></td>
        <td><span class="badge ${u.status === "aktif" ? "bg-success" : "bg-secondary"}">${u.status || "aktif"}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-primary btnEdit" data-id="${u.id}"><i class="fa-solid fa-pen"></i></button>
        </td>
      </tr>`).join("");
    tbody.querySelectorAll(".btnEdit").forEach(btn => btn.addEventListener("click", () => editUser(btn.dataset.id)));
  }

  async function loadUser() {
    try {
      const res = await API.getUsers();
      daftarUser = res.data;
      renderUser(daftarUser);
    } catch (err) { console.error(err); }
  }

  document.getElementById("btnTambahUser").addEventListener("click", () => {
    document.getElementById("formUser").reset();
    document.getElementById("userId").value = "";
    document.getElementById("userPassword").required = true;
    document.getElementById("modalUserTitle").textContent = "Tambah Pengguna";
    modalUser.show();
  });

  function editUser(id) {
    const u = daftarUser.find(x => String(x.id) === String(id));
    if (!u) return;
    document.getElementById("userId").value = u.id;
    document.getElementById("userUsername").value = u.username;
    document.getElementById("userPassword").value = "";
    document.getElementById("userPassword").required = false;
    document.getElementById("userNama").value = u.nama;
    document.getElementById("userRole").value = u.role;
    document.getElementById("userStatus").value = u.status || "aktif";
    document.getElementById("modalUserTitle").textContent = "Edit Pengguna";
    modalUser.show();
  }

  document.getElementById("formUser").addEventListener("submit", async (e) => {
    e.preventDefault();
    const passwordPlain = document.getElementById("userPassword").value;
    const payload = {
      id: document.getElementById("userId").value,
      username: document.getElementById("userUsername").value.trim(),
      nama: document.getElementById("userNama").value.trim(),
      role: document.getElementById("userRole").value,
      status: document.getElementById("userStatus").value
    };
    if (passwordPlain) payload.password = await sha256(passwordPlain);

    APP.loading("Menyimpan...");
    try {
      if (payload.id) await API.updateUser(payload);
      else await API.tambahUser(payload);
      APP.closeLoading();
      modalUser.hide();
      APP.toast("success", "Data pengguna disimpan");
      loadUser();
    } catch (err) { APP.closeLoading(); }
  });

  loadUser();
</script>
</body>
</html>
