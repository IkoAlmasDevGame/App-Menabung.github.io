<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Kelas - App Sekolah Menabung</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-piggy-bank"></i> Sekolah Menabung</div>
    <nav class="nav flex-column py-2">
      <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <div class="nav-section-title">Data Master</div>
      <a class="nav-link" href="siswa.html" data-role="admin"><i class="fa-solid fa-user-graduate"></i> Data Siswa</a>
      <a class="nav-link" href="kelas.html" data-role="admin"><i class="fa-solid fa-chalkboard"></i> Data Kelas</a>
      <a class="nav-link" href="pengguna.html" data-role="admin"><i class="fa-solid fa-users-gear"></i> Data Pengguna</a>
      <div class="nav-section-title">Tabungan</div>
      <a class="nav-link" href="transaksi.html" data-role="admin,petugas"><i class="fa-solid fa-money-bill-transfer"></i> Transaksi</a>
      <a class="nav-link" href="tabungan.html"><i class="fa-solid fa-book"></i> Buku Tabungan</a>
      <a class="nav-link" href="laporan.html" data-role="admin,petugas,walikelas"><i class="fa-solid fa-chart-line"></i> Laporan</a>
      <div class="nav-section-title">Akun</div>
      <a class="nav-link" href="profil.html"><i class="fa-solid fa-id-card"></i> Profil</a>
      <a class="nav-link" href="pengaturan.html" data-role="admin"><i class="fa-solid fa-gear"></i> Pengaturan</a>
      <a class="nav-link" href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
        <h5 class="mb-0 fw-bold">Data Kelas</h5>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="text-end d-none d-sm-block">
          <div class="fw-semibold user-display-name">-</div>
          <div class="small text-muted user-display-role">-</div>
        </div>
        <i class="fa-solid fa-circle-user fa-2x text-secondary"></i>
      </div>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Daftar Kelas</span>
          <button class="btn btn-primary btn-sm" id="btnTambahKelas"><i class="fa-solid fa-plus me-1"></i>Tambah Kelas</button>
        </div>
        <div class="table-responsive">
          <table class="table mb-0">
            <thead><tr><th>Nama Kelas</th><th>Wali Kelas</th><th>Jumlah Siswa</th><th>Total Saldo Kelas</th><th>Aksi</th></tr></thead>
            <tbody id="tblKelas"><tr><td colspan="5" class="text-center text-muted py-4">Memuat data...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalKelas" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formKelas">
        <div class="modal-header">
          <h5 class="modal-title" id="modalKelasTitle">Tambah Kelas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="kelasId">
          <div class="mb-3">
            <label class="form-label">Nama Kelas</label>
            <input type="text" class="form-control" id="kelasNama" placeholder="Contoh: 6A" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nama Wali Kelas</label>
            <input type="text" class="form-control" id="kelasWali" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Tingkat / Tahun Ajaran</label>
            <input type="text" class="form-control" id="kelasTingkat" placeholder="Contoh: 2026/2027">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
  APP.initPage(["admin"]);
  document.getElementById("btnToggleSidebar")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("show");
  });

  let daftarKelas = [];
  const modalKelas = new bootstrap.Modal(document.getElementById("modalKelas"));

  function renderKelas(data) {
    const tbody = document.getElementById("tblKelas");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Belum ada kelas</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(k => `
      <tr>
        <td class="fw-semibold">${k.nama}</td>
        <td>${k.waliKelas}</td>
        <td>${k.jumlahSiswa ?? 0}</td>
        <td>${APP.formatRupiah(k.totalSaldo ?? 0)}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary btnEdit" data-id="${k.id}"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-outline-danger btnHapus" data-id="${k.id}"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join("");
    tbody.querySelectorAll(".btnEdit").forEach(btn => btn.addEventListener("click", () => editKelas(btn.dataset.id)));
    tbody.querySelectorAll(".btnHapus").forEach(btn => btn.addEventListener("click", () => hapusKelas(btn.dataset.id)));
  }

  async function loadKelas() {
    try {
      const res = await API.getKelas();
      daftarKelas = res.data;
      renderKelas(daftarKelas);
    } catch (err) { console.error(err); }
  }

  document.getElementById("btnTambahKelas").addEventListener("click", () => {
    document.getElementById("formKelas").reset();
    document.getElementById("kelasId").value = "";
    document.getElementById("modalKelasTitle").textContent = "Tambah Kelas";
    modalKelas.show();
  });

  function editKelas(id) {
    const k = daftarKelas.find(x => String(x.id) === String(id));
    if (!k) return;
    document.getElementById("kelasId").value = k.id;
    document.getElementById("kelasNama").value = k.nama;
    document.getElementById("kelasWali").value = k.waliKelas;
    document.getElementById("kelasTingkat").value = k.tingkat || "";
    document.getElementById("modalKelasTitle").textContent = "Edit Kelas";
    modalKelas.show();
  }

  function hapusKelas(id) {
    Swal.fire({
      title: "Hapus kelas ini?", icon: "warning", showCancelButton: true,
      confirmButtonText: "Ya, Hapus", confirmButtonColor: "#e63946"
    }).then(async result => {
      if (!result.isConfirmed) return;
      APP.loading("Menghapus...");
      try { await API.hapusKelas(id); APP.closeLoading(); APP.toast("success", "Kelas dihapus"); loadKelas(); }
      catch (err) { APP.closeLoading(); }
    });
  }

  document.getElementById("formKelas").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      id: document.getElementById("kelasId").value,
      nama: document.getElementById("kelasNama").value.trim(),
      waliKelas: document.getElementById("kelasWali").value.trim(),
      tingkat: document.getElementById("kelasTingkat").value.trim()
    };
    APP.loading("Menyimpan...");
    try {
      if (payload.id) await API.updateKelas(payload);
      else await API.tambahKelas(payload);
      APP.closeLoading();
      modalKelas.hide();
      APP.toast("success", "Data kelas disimpan");
      loadKelas();
    } catch (err) { APP.closeLoading(); }
  });

  loadKelas();
</script>
</body>
</html>
